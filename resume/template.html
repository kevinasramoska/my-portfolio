<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <style>
      @page {
        size: A4;
        margin: 11mm 13mm;
      }

      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        color: #18181b;
        background: #ffffff;
        font-size: 10pt;
        line-height: 1.28;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }

      header {
        border-bottom: 1.5px solid #27272a;
        padding-bottom: 8px;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        font-size: 23pt;
        line-height: 1;
        letter-spacing: -0.02em;
      }

      .role {
        margin-top: 4px;
        font-size: 11.2pt;
        font-weight: 700;
      }

      .contact {
        display: flex;
        flex-wrap: wrap;
        gap: 3px 12px;
        margin-top: 7px;
        font-size: 9.1pt;
      }

      a {
        color: #1d4ed8;
        text-decoration: none;
      }

      section {
        margin-top: 10px;
      }

      h2 {
        border-bottom: 1px solid #a1a1aa;
        padding-bottom: 2px;
        font-size: 11pt;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .summary {
        margin-top: 5.5px;
      }

      .entry {
        margin-top: 6.5px;
        break-inside: avoid;
      }

      .entry-heading {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
      }

      h3 {
        font-size: 10.4pt;
      }

      .meta {
        flex: 0 0 auto;
        color: #3f3f46;
        font-size: 9pt;
        font-weight: 700;
      }

      .subheading {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-top: 1px;
        color: #3f3f46;
        font-size: 9.1pt;
      }

      ul {
        margin: 3px 0 0;
        padding-left: 16px;
      }

      li {
        margin-top: 2px;
      }

      .project-link {
        margin-top: 1px;
        font-size: 8.9pt;
      }

      .two-column {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }

      .skills-grid {
        display: grid;
        grid-template-columns: 0.9fr 1.35fr 1.1fr;
        gap: 6px 16px;
        margin-top: 5px;
      }

      .skill-group strong {
        display: block;
        margin-bottom: 1px;
      }

      .compact-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin-top: 5px;
      }

      .muted {
        color: #52525b;
      }
    </style>
  </head>
  <body>
    <!-- Generated from src/content/career.json; edit the template and shared content. -->
    <header>{{identity}}</header>
    <main>
      <section aria-labelledby="summary-heading">
        <h2 id="summary-heading">Summary</h2>
        <p class="summary">{{summary}}</p>
      </section>
      <section aria-labelledby="experience-heading">
        <h2 id="experience-heading">Experience</h2>
        {{experience}}
      </section>
      <section aria-labelledby="projects-heading">
        <h2 id="projects-heading">Selected Projects</h2>
        <div class="two-column">{{projects}}</div>
      </section>
      <section aria-labelledby="skills-heading">
        <h2 id="skills-heading">Skills</h2>
        <div class="skills-grid">{{skills}}</div>
      </section>
      <section aria-labelledby="education-heading">
        <h2 id="education-heading">Education &amp; Certification</h2>
        {{education}}
      </section>
    </main>
  </body>
</html>
